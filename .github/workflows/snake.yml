name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Generate light and dark contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: RayQCodes
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          grep -q '<svg' dist/github-contribution-grid-snake.svg
          grep -q '<svg' dist/github-contribution-grid-snake-dark.svg

      - name: Generate contribution activity calendar
        run: python3 .github/scripts/contribution_graph.py

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh profile activity calendar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/contribution-activity.svg assets/contribution-activity.svg
          git add assets/contribution-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution activity calendar'
          git push origin HEAD:main
